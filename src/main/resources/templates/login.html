<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login | Sparkle & Shine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Full Page Slideshow Background */
        .slideshow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .slide-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        
        .slide-bg.active {
            opacity: 1;
        }
        
        /* Dark Overlay on Background */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(0,0,0,0.8));
            z-index: -1;
        }
        
        /* Login Card */
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease-out;
            backdrop-filter: blur(0px);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo i {
            font-size: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .logo h2 {
            margin: 10px 0 0;
            font-weight: 700;
            color: #1a1a2e;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .demo-credentials {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
        }
        
        .demo-credentials p {
            margin: 5px 0;
            font-size: 12px;
            color: #666;
        }
        
        .demo-credentials code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 11px;
        }
        
        /* Slide Indicators */
        .slide-dots {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dot:hover {
            background: rgba(255,255,255,0.9);
            transform: scale(1.2);
        }
        
        .dot.active {
            background: #FFD700;
            width: 20px;
            border-radius: 5px;
        }
        
        @media (max-width: 768px) {
            .login-card { padding: 30px; }
        }
    </style>
</head>
<body>
    <!-- Full Page Background Slideshow -->
    <div class="slideshow-bg">
        <div class="slide-bg" style="background-image: url('/images/car1.jpg');"></div>
        <div class="slide-bg" style="background-image: url('/images/car2.jpg');"></div>
        <div class="slide-bg" style="background-image: url('/images/car3.jpg');"></div>
    </div>
    <div class="overlay"></div>
    
    <!-- Slide Dots -->
    <div class="slide-dots" id="slideDots"></div>
    
    <!-- Login Card -->
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-car-wash"></i>
                <h2>Sparkle & Shine</h2>
                <p>Car Wash Management System</p>
            </div>
            
            <div th:if="${param.error}" class="error-message">
                <i class="fas fa-exclamation-triangle"></i> Invalid username or password
            </div>
            
            <form method="post" action="/login">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" name="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-arrow-right-to-bracket"></i> Login
                </button>
            </form>
            
            <div class="demo-credentials">
                <p><strong>Demo Credentials:</strong></p>
                <p>Admin: <code>admin</code> / <code>admin123</code></p>
                <p>Employee: <code>employee1</code> / <code>emp123</code></p>
            </div>
        </div>
    </div>

    <script>
        // ========== BACKGROUND SLIDESHOW ==========
        const slides = document.querySelectorAll('.slide-bg');
        const dotsContainer = document.getElementById('slideDots');
        let currentSlide = 0;
        let slideInterval;
        const slideDelay = 5000; // 5 seconds
        
        // Create dots
        slides.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(index));
            dotsContainer.appendChild(dot);
        });
        
        const dots = document.querySelectorAll('.dot');
        
        function updateDots() {
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }
        
        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
            updateDots();
        }
        
        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
            resetInterval();
        }
        
        function goToSlide(index) {
            currentSlide = index;
            showSlide(currentSlide);
            resetInterval();
        }
        
        function resetInterval() {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, slideDelay);
        }
        
        // Start slideshow
        slideInterval = setInterval(nextSlide, slideDelay);
        
        // Pause on hover over login card
        const loginCard = document.querySelector('.login-card');
        loginCard.addEventListener('mouseenter', () => clearInterval(slideInterval));
        loginCard.addEventListener('mouseleave', () => {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, slideDelay);
        });
    </script>
</body>
</html>
