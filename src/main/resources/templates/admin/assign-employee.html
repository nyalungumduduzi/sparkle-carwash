<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Employee | Sparkle & Shine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 600px; margin-top: 50px; }
        .card { border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-warning">
                <h4><i class="fas fa-user-check"></i> Assign Employee</h4>
            </div>
            <div class="card-body">
                <p><strong>Booking ID:</strong> #<span th:text="${booking.bookingId}">-</span></p>
                <p><strong>Customer:</strong> <span th:text="${booking.customerName}">-</span></p>
                <p><strong>Service:</strong> <span th:text="${booking.serviceType}">-</span></p>
                <p><strong>Date:</strong> <span th:text="${booking.bookingDate}">-</span></p>
                <hr>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Select Employee</label>
                        <select name="employeeId" class="form-control" required>
                            <option value="">-- Choose Employee --</option>
                            <option th:each="emp : ${employees}" th:value="${emp.userId}" th:text="${emp.firstName} + ' ' + ${emp.lastName} + ' (' + ${emp.username} + ')'"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Assign & Send</button>
                    <a href="/admin/bookings" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
